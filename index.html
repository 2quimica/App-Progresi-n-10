<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Progresión 10: Fuerzas Eléctricas y Magnéticas</title>
  <style>
    :root {
      --bg-dark: #080c16;
      --bg-card: #12192c;
      --bg-card-hover: #1a243f;
      --border-color: #243252;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-cyan-glow: rgba(6, 182, 212, 0.25);
      --accent-purple: #8b5cf6;
      --accent-purple-glow: rgba(139, 92, 246, 0.25);
      --accent-amber: #f59e0b;
      --accent-amber-glow: rgba(245, 158, 11, 0.2);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-stack);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Fixed Sticky Top Navigation & Progress Bar */
    .top-bar {
      position: sticky;
      top: 8px;
      z-index: 100;
      background: rgba(18, 25, 44, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .top-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-tag {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .phase-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .progress-bar-track {
      width: 100%;
      height: 8px;
      background-color: #0a0f1d;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      transition: width 0.4s ease;
    }

    /* Standard App Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-header-badge {
      align-self: flex-start;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan-glow);
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.25;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    strong {
      color: var(--text-main);
    }

    /* Remember Connection Box */
    .remember-box {
      background: #0a0f1d;
      border-left: 4px solid var(--accent-cyan);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
    }

    /* Teacher Pause Card */
    .teacher-pause-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(139, 92, 246, 0.12));
      border: 2px dashed var(--accent-amber);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .teacher-pause-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent-amber);
    }

    /* Form Inputs & Buttons */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-control {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background-color: #0a0f1d;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-control:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px var(--accent-cyan-glow);
    }

    .btn {
      width: 100%;
      min-height: 50px;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      user-select: none;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-cyan-glow);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: #17223b;
      color: var(--text-main);
      border: 1.5px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--accent-cyan);
    }

    .btn-secondary.selected {
      border-color: var(--accent-cyan);
      background-color: rgba(6, 182, 212, 0.18);
      color: #fff;
    }

    .btn-amber {
      background: linear-gradient(135deg, var(--accent-amber), #d97706);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-amber-glow);
    }

    .btn-disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Simulators Container */
    .sim-container {
      background-color: #0a0f1d;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sim-canvas-box {
      width: 100%;
      min-height: 210px;
      background-color: #050812;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .slider-control {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #141d33;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .slider-control label {
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      color: var(--accent-cyan);
    }

    .slider-control input[type="range"] {
      width: 100%;
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

    .value-display {
      font-weight: 800;
      color: var(--text-main);
    }

    /* Options Stack */
    .options-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background-color: #0a0f1d;
      color: var(--text-main);
      font-size: 0.92rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(.btn-disabled) {
      border-color: var(--accent-cyan);
      background-color: var(--bg-card-hover);
    }

    .option-btn.selected {
      border-color: var(--accent-cyan);
      background-color: rgba(6, 182, 212, 0.12);
    }

    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background-color: var(--border-color);
      color: var(--text-main);
      font-weight: 800;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .feedback-box {
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9rem;
    }

    .feedback-correct {
      background-color: var(--success-bg);
      border: 1.5px solid var(--success);
      color: #6ee7b7;
    }

    .feedback-incorrect {
      background-color: var(--danger-bg);
      border: 1.5px solid var(--danger);
      color: #fca5a5;
    }

    /* Flashcards */
    .flashcard {
      background: #0a0f1d;
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .flashcard-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent-cyan);
      text-transform: uppercase;
    }

    /* Touch Classifier (3-4 Columns) */
    .category-columns {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 520px) {
      .category-columns {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    .category-box {
      background-color: #0a0f1d;
      border: 1.5px dashed var(--border-color);
      border-radius: 12px;
      padding: 10px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s;
    }

    .category-box.active-target {
      border-color: var(--accent-cyan);
      background-color: rgba(6, 182, 212, 0.05);
    }

    .category-title {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
      color: var(--accent-cyan);
    }

    .items-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      background-color: #0a0f1d;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .chip-item {
      padding: 8px 12px;
      border-radius: 20px;
      background-color: #1a253e;
      border: 1px solid var(--border-color);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .chip-item.selected-chip {
      border-color: var(--accent-cyan);
      background-color: var(--accent-cyan);
      color: #000;
      font-weight: 800;
    }

    /* Concept Map Touch Interactive */
    .map-nodes-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 480px) {
      .map-nodes-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .map-node {
      background-color: #0a0f1d;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .map-node-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .map-slot {
      min-height: 42px;
      border: 1.5px dashed var(--accent-cyan);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--accent-cyan);
      cursor: pointer;
      background-color: rgba(6, 182, 212, 0.04);
      padding: 6px 10px;
      text-align: center;
    }

    .map-slot.filled {
      border-style: solid;
      background-color: #1e2c4a;
      color: #fff;
    }

    /* Quiz Navigator Grid */
    .quiz-nav-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      margin: 8px 0;
    }

    .quiz-nav-btn {
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0a0f1d;
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-nav-btn.active {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 0 2px var(--accent-cyan-glow);
    }

    .quiz-nav-btn.answered {
      background-color: #1e2c4a;
      color: #fff;
      border-color: var(--accent-purple);
    }

    /* Evidence Screenshot Card */
    .evidence-card {
      background: linear-gradient(180deg, #12192c 0%, #070b14 100%);
      border: 2px solid var(--accent-cyan);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.25);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .score-large {
      font-size: 3.5rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-perf {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      align-self: center;
    }

    .badge-exc { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .badge-good { background: rgba(6, 182, 212, 0.2); color: #38bdf8; border: 1px solid #06b6d4; }
    .badge-proc { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-reinf { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      text-align: left;
    }

    .summary-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .summary-table td:nth-child(2) {
      text-align: right;
      font-weight: 700;
      color: var(--text-main);
    }

    .camera-notice {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(239, 68, 68, 0.2));
      border: 1.5px dashed var(--accent-amber);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #fef08a;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Top Progress Bar -->
    <div id="top-bar" class="top-bar" style="display: none;">
      <div class="top-bar-header">
        <span id="user-display-tag" class="user-tag">Estudiante</span>
        <span id="phase-display-badge" class="phase-badge">FASE 1 DE 5</span>
      </div>
      <div class="progress-bar-track">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- Main Dynamic Content Container -->
    <main id="app-content"></main>
  </div>

  <script>
    // --- QUIZ BANK FOR PROGRESIÓN 10 (EXACTLY 10 QUESTIONS) ---
    const QUIZ_BANK = [
      {
        id: 1,
        topic: "oersted",
        question: "¿Cuál fue la trascendental conclusión del experimento realizado por Hans Christian Oersted al observar una brújula cerca de un alambre con corriente?",
        options: [
          "Demostró que las cargas eléctricas en movimiento (corriente) generan un campo magnético a su alrededor.",
          "Demostró que la corriente eléctrica destruye el magnetismo de las brújulas.",
          "Probó que la fuerza gravitatoria aumenta cuando la batería se calienta.",
          "Comprobó que únicamente los imanes de hierro pueden conducir corriente."
        ],
        correct: 0,
        explanation: "Oersted descubrió que las cargas eléctricas en movimiento producen un campo magnético capaz de desviar la aguja imantada de una brújula, unificando la electricidad y el magnetismo."
      },
      {
        id: 2,
        topic: "polaridad_campo",
        question: "Al invertir la polaridad de la batería en el circuito (cambiar el sentido de la corriente), ¿qué le ocurre al campo magnético generado?",
        options: [
          "Permanece exactamente igual y la brújula no cambia de orientación.",
          "El campo magnético invierte su sentido, desviando la aguja de la brújula en sentido opuesto.",
          "El campo magnético se cancela permanentemente y se vuelve cero.",
          "La corriente se convierte inmediatamente en fuerza gravitatoria."
        ],
        correct: 1,
        explanation: "El sentido del campo magnético generado depende directamente de la dirección de la corriente. Al invertir la corriente, las líneas de inducción invierten su dirección."
      },
      {
        id: 3,
        topic: "geometria_campo",
        question: "¿Qué forma geométrica poseen las líneas de campo magnético alrededor de un conductor recto que lleva corriente?",
        options: [
          "Líneas rectas paralelas que se extienden al infinito sin curvarse.",
          "Circunferencias concéntricas y cerradas en planos perpendiculares al conductor.",
          "Parábolas abiertas que salen únicamente de los extremos del cable.",
          "Espirales cuadradas que se disipan en el aire."
        ],
        correct: 1,
        explanation: "A diferencia de las líneas del campo eléctrico que pueden nacer y morir en cargas, las líneas del campo magnético alrededor de un alambre recto forman circuitos cerrados en forma de circunferencias concéntricas."
      },
      {
        id: 4,
        topic: "mano_derecha",
        question: "Según la Regla de la Mano Derecha para un alambre recto, ¿qué representan respectivamente el dedo pulgar y los demás dedos curvados?",
        options: [
          "Pulgar = Masa del alambre; Dedos curvados = Voltaje de la batería.",
          "Pulgar = Dirección de la corriente ($I$); Dedos curvados = Sentido de las líneas de inducción del campo magnético ($B$).",
          "Pulgar = Fuerza de gravedad; Dedos curvados = Carga electrostática.",
          "Pulgar = Campo magnético; Dedos curvados = Velocidad de la luz."
        ],
        correct: 1,
        explanation: "Si se toma el alambre con la mano derecha de modo que el pulgar apunte en la dirección de la corriente, los dedos doblados indican la dirección circular del campo magnético."
      },
      {
        id: 5,
        topic: "direccion_mano_derecha",
        question: "Si la corriente eléctrica en un alambre vertical fluye HACIA ARRIBA (↑), ¿en qué sentido circulan las líneas de campo magnético vistas desde arriba?",
        options: [
          "En sentido Antihorario (contrario a las manecillas del reloj).",
          "En sentido Horario (a favor de las manecillas del reloj).",
          "En línea recta hacia la derecha.",
          "En línea recta hacia la izquierda."
        ],
        correct: 0,
        explanation: "Apuntando el pulgar de la mano derecha hacia arriba, las yemas de los dedos se curvan rotando en sentido antihorario."
      },
      {
        id: 6,
        topic: "unidades_tesla",
        question: "¿Cuál es la unidad oficial del Sistema Internacional (SI) para la intensidad del campo magnético y a cuántos Gauss ($G$) equivale?",
        options: [
          "El Tesla ($T$), y $1\\text{ T} = 10,000\\text{ Gauss}$.",
          "El Coulomb ($C$), y $1\\text{ C} = 100\\text{ Gauss}$.",
          "El Watt ($W$), y $1\\text{ W} = 1,000\\text{ Gauss}$.",
          "El Newton ($N$), y $1\\text{ N} = 10\\text{ Gauss}$."
        ],
        correct: 0,
        explanation: "La unidad SI del campo magnético es el Tesla ($T = \\text{N}/(\\text{A}\\cdot\\text{m})$). Una unidad menor comúnmente usada es el Gauss ($G$), donde $1\\text{ T} = 10,000\\text{ G}$."
      },
      {
        id: 7,
        topic: "corrientes_paralelas_mismo",
        question: "¿Qué ocurre entre dos alambres paralelos cuando conducen corrientes eléctricas en el MISMO SENTIDO (↑ ↑)?",
        options: [
          "Experimentan una fuerza de ATRACCIÓN mutua.",
          "Experimentan una fuerza de REPULSIÓN mutua.",
          "No ejercen ninguna fuerza entre sí por ser metálicos.",
          "Se calientan hasta anular sus campos magnéticos."
        ],
        correct: 0,
        explanation: "Experimentos como los de Ampère demostraron que corrientes en el mismo sentido se atraen ($\u2191\u2191 \\rightarrow \\text{Atracción}$), lo cual es análogo pero inverso a la ley de las cargas electrostáticas."
      },
      {
        id: 8,
        topic: "corrientes_paralelas_opuesto",
        question: "¿Qué ocurre entre dos conductores paralelos si transportan corrientes en SENTIDOS OPUESTOS (↑ ↓)?",
        options: [
          "Se atraen intensamente.",
          "Experimentan una fuerza de REPULSIÓN mutua.",

      return `
        <div style="background: #141d33; padding: 12px; border-radius: 10px; display: flex; justify-content: space-around; text-align: center;">

          <span class="card-header-badge" style="align-self: center;">✅ PROGRESIÓN 10 COMPLETADA</span>
          <h2 style="color: #fff; font-size: 1.1rem; margin-bottom: 2px;">LA ENERGÍA EN LOS PROCESOS DE LA VIDA DIARIA</h2>
          <p style="color: var(--accent-cyan); font-weight: 700; font-size: 0.85rem;">PROGRESIÓN 10: FUERZAS ELÉCTRICAS Y MAGNÉTICAS</p>

          <div style="background-color: #0a0f1d; border-radius: 12px; padding: 12px;">
            <div style="font-size: 1.15rem; font-weight: 800; color: var(--text-main);">${state.user.name}</div>
            <div style="font-size: 0.9rem; font-weight: 700; color: var(--accent-cyan);">GRUPO: ${state.user.group}</div>
          </div>

          <div class="score-large">${pct}%</div>
          <div style="font-weight: 800; font-size: 1.1rem; color: var(--text-main);">
            RESULTADO: ${correct} / 10 ACIERTOS
          </div>

          <div class="badge-perf ${perfClass}">
            ${perfText}
          </div>

          <table class="summary-table">
            <tr><td>Estudiante:</td><td>${state.user.name}</td></tr>
            <tr><td>Grupo:</td><td>${state.user.group}</td></tr>
            <tr><td>Reactivos Correctos:</td><td>${correct} de 10</td></tr>
            <tr><td>Porcentaje Obtenido:</td><td>${pct}%</td></tr>
            <tr><td>Fecha y Hora:</td><td>${dateStr} - ${timeStr}</td></tr>
            <tr><td>Estatus de Sesión:</td><td>✅ EVALUACIÓN ENTREGADA</td></tr>
          </table>

          <!-- Metacognitive Reflection Box -->
          <div style="background-color: #0a0f1d; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; text-align: left;">
            <label style="font-size: 0.8rem; font-weight: 700; color: var(--accent-cyan); text-transform: uppercase;">🧠 Mi Reflexión Escrita:</label>
            <p style="font-size: 0.82rem; margin-top: 4px; color: var(--text-muted);">En tus propias palabras: ¿Qué evidencia demuestra que la electricidad y el magnetismo están íntimamente relacionados?</p>
            <textarea id="reflection-text" class="input-control" rows="3" style="margin-top: 6px; font-size: 0.88rem;" placeholder="Escribe aquí tu explicación para el profesor..." onchange="saveReflection(this.value)">${state.evaluate.reflection}</textarea>
          </div>

          <div class="camera-notice">
            📸 TOMA UNA CAPTURA DE ESTA PANTALLA Y ENVÍALA A TU PROFESOR COMO EVIDENCIA.
          </div>

          <!-- Review Answers Collapsible -->
          <div style="margin-top: 8px;">
            <button class="btn btn-secondary" onclick="toggleAnswerReview()">
              🔍 REVISAR RETROALIMENTACIÓN DE LAS 10 PREGUNTAS
            </button>
            <div id="answers-review-box" style="display: none; flex-direction: column; gap: 10px; margin-top: 12px; text-align: left;">
              ${QUIZ_BANK.map((q, idx) => {
                const userAns = state.evaluate.answers[idx];
                const isCorr = userAns === q.correct;
                return `
                  <div style="background: #0a0f1d; border: 1px solid ${isCorr ? 'var(--success)' : 'var(--danger)'}; border-radius: 10px; padding: 10px; font-size: 0.85rem;">
                    <div style="font-weight: 700; color: #fff;">${idx + 1}. ${q.question}</div>
                    <div style="color: ${isCorr ? '#6ee7b7' : '#fca5a5'}; margin-top: 4px;">
                      Tu respuesta: ${q.options[userAns]} ${isCorr ? '✅' : '❌'}
                    </div>
                    ${!isCorr ? `<div style="color: #38bdf8; font-weight: 600;">Respuesta correcta: ${q.options[q.correct]}</div>` : ''}
                    <div style="color: var(--text-muted); margin-top: 4px; font-size: 0.8rem;"><strong>Explicación:</strong> ${q.explanation}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <button class="btn btn-secondary" style="margin-top: 12px;" onclick="resetQuizSession()">
            🔄 Reiniciar sesión para otro estudiante
          </button>
        </div>
      `;
    }

    function saveReflection(val) {
      state.evaluate.reflection = val;
      saveState();
    }

    function toggleAnswerReview() {
      const box = document.getElementById('answers-review-box');
      if (box) {
        box.style.display = box.style.display === 'none' ? 'flex' : 'none';
      }
    }

    function resetQuizSession() {
      if (confirm("¿Deseas reiniciar la aplicación para otro estudiante?")) {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch(e) {}
        state.user = { name: '', group: '' };
        state.phase = 0;
        state.screen = 'START';
        state.evaluate.answers = new Array(10).fill(null);
        state.evaluate.submitted = false;
        renderApp();
      }
    }

    function confirmTeacherPause(num) {
      alert(`✅ Pausa Docente #${num} registrada. Continúa con tu clase.`);
    }

    function goToPhase(phaseNum, screenName) {
      state.phase = phaseNum;
      state.screen = screenName;
      saveState();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- INITIALIZATION ---
    window.onload = function() {
      loadState();
      renderApp();
    };
  </script>
</body>
</html>
